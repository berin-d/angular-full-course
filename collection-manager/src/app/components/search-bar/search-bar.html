<div class="flex items-center gap-2 p-2">
    <div class="flex flex-1 items-center p-2 gap-2 bg-white border border-gray-300 rounded-xl">
        <img class="w-5 h-5 shrink-0" src="img/magnifying-glass-solid-full.svg">
        <input id="live-search" class="focus:outline-none flex-1" type="search" placeholder="Search..."
            [(ngModel)]="search" />
    </div>
    <button (click)="searchClick()"
        class="bg-blue-500 text-white px-4 py-2 rounded-xl hover:bg-blue-600 cursor-pointer shrink-0">
        Search
    </button>
</div>
