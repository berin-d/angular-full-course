<article
    class="flex flex-col rounded-2xl border border-gray-100 w-3xs max-w-sm bg-white shadow-sm hover:shadow-md transition-all duration-300 cursor-pointer overflow-hidden group hover:scale-[1.02]">

    <figure class="w-full h-52 overflow-hidden">
        <img class="w-full h-full object-cover object-center" src="{{ item().image }}" alt="{{ item().name }}">
    </figure>

    <div class="flex flex-col gap-3 p-4">

        <div class="flex justify-between items-center">
            <span
                class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase bg-gradient-to-r from-amber-400 to-yellow-300 text-amber-900 shadow-sm shadow-amber-200">
                ⬡ {{ item().rarity}}
            </span>
            <p class="text-lg font-bold text-emerald-600">{{ item().price }} €</p>
        </div>
        <div class=" flex flex-col gap-1">
            <h2 class="text-base font-bold text-zinc-800 leading-tight">{{ item().name }}</h2>
            <p class="text-sm text-zinc-400 leading-relaxed">{{ item().description }}</p>
        </div>

    </div>
</article>
