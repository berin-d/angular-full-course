<main class="flex flex-col h-screen p-2">
  <header class="flex justify-end">
    <app-search-bar [(search)]="searchText"></app-search-bar>
  </header>

  <section class="flex gap-6 items-center justify-center flex-1 flex-wrap">
    <!-- 1) Solution avec @empty -->
    @for (item of collectionItems(); track item.name) {
      @switch (item.rarity) {
        @case ('Common') {
          <div>
            <app-collection-item-card [item]="item"></app-collection-item-card>
            <hr class="border-gray-300 my-4 border-2 rounded-lg" />
          </div>
        }
        @case ('Rare') {
          <div>
            <app-collection-item-card [item]="item"></app-collection-item-card>
            <hr class="border-emerald-300 my-4 border-2 rounded-lg" />
          </div>
        }
        @case ('Epic') {
          <div>
            <app-collection-item-card [item]="item"></app-collection-item-card>
            <hr class="border-purple-300 my-4 border-2 rounded-lg" />
          </div>
        }
        @case ('Legendary') {
          <div>
            <app-collection-item-card [item]="item"></app-collection-item-card>
            <hr class="border-yellow-300 my-4 border-2 rounded-lg" />
          </div>
        }
        @default {
          <app-collection-item-card [item]="item"></app-collection-item-card>
        }
      }
    } @empty {
      <p class="text-gray-500 text-sm">No items found.</p>
    }
  </section>

  <!-- 2) Solution avec @let, @if, @else -->

  <!-- 
  @let itemsCount = collectionItems().length
  @if(itemsCount > 0) {
    <p class="text-center text-sm text-gray-500">
      Found {itemsCount} {itemsCount === 1 ? 'item' : 'items'}.
    </p>
  } else {
    <p class="text-center text-sm text-gray-500">
      No items found.
    </p>
  }
  -->
  <div>
    <p class="text-center text-sm text-gray-500"></p>
  </div>

  <div class="flex w-full items-center justify-center p-4">
    <button (click)="addGenericItem()" class="border p-2 rounded-lg hover:cursor-pointer bg-green-500 text-amber-100 hover:bg-green-600 hover:scale-105 transition-all duration-300">
      Add generic item

    </button>
  </div>
</main>
