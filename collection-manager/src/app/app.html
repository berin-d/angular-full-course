<main class="h-screen p-2">

  <header class="flex justify-end">
    <div class="flex flex-col items-center">

      <!-- Two-way binding : [(search)] 
         One-way binding : [search] or [ngModel]
         Event binding : (searchButtonClicked) 
    -->
      <app-search-bar (submit)="incrementCount()" [(search)]="searchText">
      </app-search-bar>
      <div class="flex gap-4">
        <p>Click count : {{count}}</p>
        <p>Search text : {{searchText}}</p>
      </div>
    </div>
  </header>

  <section class="flex gap-6 items-center justify-center h-full">
    <app-collection-item-card [item]="selectedItem()"></app-collection-item-card>
  </section>

  <div>
    <p class="text-center text-sm text-gray-500">
      {{ selectedItemIndex()+1}} out of {{ itemList.length }} items have been clicked
    </p>
  </div>

  <div class="flex w-full items-center justify-center p-4">
    <button
      class="border p-2 rounded-lg hover:cursor-pointer bg-blue-500 text-amber-100 hover:bg-blue-600 hover:scale-105 transition-all duration-300"
      (click)="incrementIndex()">Toggle</button>
  </div>


</main>
